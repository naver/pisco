# campaign.conf — knobs for `expmon campaign` (sourced by preflight / tick / watchdog). Created 2026-11-11.
# Edit by hand; the LLM wake may NOT edit this file (hard rule 3 in CAMPAIGN.md).
CAMP_LABEL='probes'            # the expmon --exp label every campaign run carries (grid/sweep/verdict key)
CAMP_DIR='campaign_probes'             # this campaign's dir (repo-relative); several campaigns can share a repo, even across clusters
CAMP_UNTIL='2027-02-09'            # YYYY-MM-DD, INCLUSIVE: launches allowed through that day 23:59 (default: init + 90 days, EXP_CAMP_WINDOW_DAYS); `expmon campaign extend` adds 90 more
CAMP_EMAIL='herve.dejean@naverlabs.com'            # watchdog alerts + daemon mail (EXP_NOTIFY_CMD wins when set)
CAMP_MODEL='claude-opus-5-5'            # PINNED model for LLM wakes — results must be attributable (NCP drifted mid-campaign)
CAMP_CLAUDE='/home/hdejean/.local/bin/claude'          # the binary (2.1.318 (Claude Code) at init); absolute path, cron has no PATH
CAMP_EVERY=30              # sensor tick cadence in minutes — shell only, no LLM
CAMP_HEARTBEAT_H=24               # the LLM wakes at least this often even when nothing changed
CAMP_RETRY_MIN=30                 # cool-down before the LLM re-wakes on STANDING problems or an idle campaign with work left (NEXT absent)
CAMP_IDLE_WAKE_H=1                # idle hours (no campaign GPU-second, nothing queued, window open, NEXT absent) that count as work left
CAMP_LLM_TIMEOUT=45m              # hard cap on one LLM wake (timeout(1) syntax)
CAMP_MAX_TRAIN=0                  # trainings in flight at once (CAMPAIGN.md "Budget and caps" refers to it)
CAMP_MAX_SUBMIT_PER_WAKE=8        # new submissions one wake may make (probe campaigns with 2-minute cells want 3+)
CAMP_PATCH_LINES=40                # 0 = the wake may not edit code; N = it may apply a <=N-line fix inside CAMPAIGN.md '## Patchable' paths
CAMP_GPU_TYPE='a100'      # gres substring for gpucap; preflight checks it matches THIS cluster's sinfo -o %G
CAMP_PARTITIONS='gpu'  # partitions the campaign may submit to; preflight checks/probes each
CAMP_IDLE_H=24                    # watchdog alerts after this many hours without a campaign GPU-second
CAMP_DISK_FLOOR_GB=200            # no launch below this much free space; watchdog alerts
CAMP_PUSH=0                       # the tick commits AND pushes the campaign dir + ledger after every wake
CAMP_DAEMON=1                     # the tick resubmits the expmon daemon when it is gone (second failure domain)
CAMP_COMMIT_PATHS='scripts/probes expQ/probes docs/probe_campaign_2026-11.md'              # extra repo paths the tick commits after a wake, e.g. 'configs slurm' (space-separated)
CAMP_NOISE_PT=2                 # metric noise band: below it a difference is not a result (CAMPAIGN.md gates)
# --- guardrails and wake economics (2026-11-06) --- all enforced by the tick / the wake hook, none by prose
CAMP_WRITE_ROOTS=''               # dirs the wake may write under, space-separated (empty = this repo). The hook refuses writes elsewhere,
                                  # and ALWAYS refuses ~/.claude, campaign.conf, the tick's state dir and sibling campaign dirs
CAMP_WAKE_GIT=0                   # 1 = the wake may `git add` / `git commit` itself (a law that commits patches); default: only the tick commits
CAMP_MAX_TURNS=300                # hard cap on one wake's tool turns (--max-turns); sensors.log records turns= per wake, tighten after a week
CAMP_MAX_USD=0                    # hard cap on one wake's ESTIMATED spend (--max-budget-usd, client-side estimate); 0 = off
CAMP_RUNNER=cli                   # how a wake drives Claude: cli = `claude -p` (default); sdk = the Agent SDK (expmon/sdk_runner.py),
                                  # same arguments, same guard, same log/result; needs CAMP_SDK_PYTHON to import claude_agent_sdk
CAMP_SDK_PYTHON=$HOME/.local/share/expmon/sdk-venv/bin/python   # Python >= 3.10 with claude-agent-sdk; preflight checks it
CAMP_READ_DENY=''                 # extra paths a wake may never read (planted answers, frozen judges, held-out sets), space-separated, globs ok
CAMP_READ_DENY_SECRETS=1          # 1 = also ~/.ssh ~/.config/naver ~/.git-credentials ~/.netrc ~/.aws ~/.kube ~/.claude*/.credentials.json
CAMP_GUARD_FAIL=closed            # closed = a guard error refuses the call (default); open = the pre-2026-11-09 allow
CAMP_GUARD_MAX_STREAK=3           # refusals in a row that end the wake -> BLOCKED.md + NEXT waiting-owner (0 = off)
CAMP_GUARD_MAX_DENIALS=20         # refusals in one wake that end it (0 = off)
CAMP_CLAUDE_PIN=1                 # 1 = a new `claude --version` holds wakes until preflight passes on it (and the toy does)
CAMP_TYPED_TOOLS=on               # with CAMP_RUNNER=sdk: on = typed expmon tools offered (label, per-wake cap, own runs only, in code);
                                  # strict = the shell form of launch/sweep/verdict/probe/kill/note is refused too; off = none
CAMP_MODEL_LIGHT=''               # cheap model for bookkeeping wakes (reasons in CAMP_LIGHT_REASONS); empty = every wake runs CAMP_MODEL.
                                  # Use a name THIS claude recognises (`claude --model sonnet` works everywhere): an unknown id is logged
                                  # as unrecognized_model and the call may run on another model at another price.
                                  # A light wake may not launch, kill, record verdicts/probes or edit code: it writes `wake-in 1` and the pinned model follows
CAMP_LIGHT_REASONS='heartbeat upstream'   # wake reasons that need no science decision
CAMP_VERIFY=1                     # after a wake that changed the Settled block or the verdicts, a READ-ONLY verifier re-derives every claim -> VERIFY.md
CAMP_MODEL_VERIFY=''              # model for the verifier (a skeptic needs a strong one); empty = CAMP_MODEL
CAMP_BRIEF_KB=48                  # cap per section of the tick-written wake brief (BRIEF.md); the full output is kept beside it
